 

name: Demo Trading Bot Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'bot.py'
      - '.github/workflows/demo-test.yml'

permissions:
  contents: read

jobs:
  demo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run offline demo simulation
        run: python bot.py --steps 2 --interval 0
