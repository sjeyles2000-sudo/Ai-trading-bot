name: Paper trading unit tests

on:
  push:
    branches:
      - paper-market-data-upgrade-2026-11-07
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q bot.py tests
      - name: Run isolated paper-trading tests (mocked market data)
        run: python -m unittest discover -s tests -v
