name: Paper trading safety and market data

on:
  push:
    branches:
      - paper-market-data-upgrade-2026-11-07
      - fomo-signals-wallet-watch-2026-11-07
      - public-wallet-leaderboard-2026-11-07
  pull_request:
    branches:
      - main
      - scheduled-paper-ledger-2026-11-07

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q bot.py tests
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check docs/dashboard.js
          node --check docs/alerts.js
      - name: Run isolated paper-trading tests (mocked market data)
        run: python -m unittest discover -s tests -v

  market-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check public data and replay virtual historical trades only
        run: python bot.py
