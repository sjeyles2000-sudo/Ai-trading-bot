name: Dashboard performance read-only checks
on:
  push:
    branches:
      - dashboard-performance-review-2026-11-07
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check docs/dashboard.js
          node --check docs/performance.js
          node --check docs/alerts.js
          node --check docs/sw.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dashboard markup, read-only safety and all existing tests
        run: python -m unittest discover -s tests -v
